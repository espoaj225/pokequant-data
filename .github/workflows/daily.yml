name: Daily price collection
on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC, after tcgcsv's ~20:00 UTC refresh
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect today's prices (ALL Pokemon products)
        run: python scripts/daily.py
      - name: Validate
        run: python scripts/validate.py
      - name: Commit & push collected data
        run: |
          git config user.name pokequant-bot
          git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
      - name: Build analytics + site
        run: |
          pip install -q numpy pandas
          python scripts/analytics.py
          python scripts/build_site.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
