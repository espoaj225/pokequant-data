name: Daily price collection
on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC, after tcgcsv's ~20:00 UTC refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect today's prices
        run: python scripts/daily.py
      - name: Rebuild SQLite database
        run: python scripts/build_db.py
      - name: Validate
        run: python scripts/validate.py
      - name: Commit & push
        run: |
          git config user.name pokequant-bot
          git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
